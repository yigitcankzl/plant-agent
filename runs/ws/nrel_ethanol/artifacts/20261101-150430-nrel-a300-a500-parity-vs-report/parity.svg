<text x="74" y="576" font-weight="600" fill="#111">A300: 33 of 35 checks within 5 % (26 within 3 %); 8 streams, 8 of the checks are temperatures (within 3 K / 5 K)</text>
<text x="74" y="592" font-weight="600" fill="#111">A500: 28 of 64 checks within 5 % (24 within 3 %); 17 streams, 17 of the checks are temperatures (within 3 K / 5 K)</text>
<text x="74" y="610" fill="#555" font-size="11">Report values are NREL's Aspen Plus model (Humbird et al. 2011, Appendix E), not plant measurements</text>
<text x="74" y="624" fill="#555" font-size="11">sugars, polymers and solids are mass-equivalent DWSIM stand-in compounds.</text>
<text x="74" y="639" fill="#555" font-size="11">A500 after Muse's calibration session (rev 1) and one recorded engineer correction (rev 2, D-502 boilup); heat duties not plotted (0 of 7 within 10 %).</text>
