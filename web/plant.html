<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlantAgent · Process plant</title>
<style>
  :root {
    --bg: #15191f; --panel: #1c2129; --panel2: #232a33; --line: #2e3742; --text: #d9e0e8; --muted: #8592a3;
    --accent: #4da3ff; --ok: #3fb67a; --warn: #e3a33a; --fail: #ef5a4f; --info: #9aa7ff; --paper: #fbfaf6;
    --mono: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; --sans: "Inter", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 var(--sans); }
  .app { display: grid; grid-template-rows: 48px 1fr 150px; grid-template-columns: 270px 1fr 410px; height: 100vh; }
  header { grid-column: 1 / 4; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .logo { font: 700 15px var(--mono); } .logo span { color: var(--accent); }
  select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; font: 600 12.5px var(--sans); }
  .cmd { flex: 1; position: relative; max-width: 720px; }
  .cmd input { width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 8px 12px 8px 30px; font: 13.5px var(--sans); outline: none; }
  .cmd input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(77,163,255,.15); }
  .cmd .k { position: absolute; left: 11px; top: 7px; color: var(--muted); font: 12px var(--mono); }
  .btn { background: var(--panel2); border: 1px solid var(--line); color: var(--text); padding: 6px 11px; border-radius: 5px; cursor: pointer; font: 12.5px var(--sans); white-space: nowrap; }
  .btn:hover { border-color: var(--accent); } .btn.go { background: #1d4f86; border-color: #2b6cb3; font-weight: 600; }
  .btn:disabled { opacity: .45; cursor: default; }
  aside.left { grid-row: 2 / 4; background: var(--panel); border-right: 1px solid var(--line); overflow: auto; }
  .sec { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .sec h4 { margin: 0 0 8px; font: 600 10.5px var(--sans); color: var(--muted); letter-spacing: .8px; text-transform: uppercase; display: flex; justify-content: space-between; }
  .eq { padding: 5px 6px; border-radius: 5px; cursor: pointer; }
  .eq:hover, .eq.sel { background: var(--panel2); }
  .eq .t { display: flex; justify-content: space-between; font: 600 12px var(--mono); }
  .eq .t span { font-weight: 400; color: var(--muted); }
  .eq .why { color: var(--muted); font-size: 11px; }
  .bar { height: 6px; background: #2a323d; border-radius: 3px; margin: 4px 0 2px; position: relative; overflow: hidden; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; transition: width .25s, background .25s; }
  .bar::after { content: ""; position: absolute; left: calc(100% / 1.3); top: -2px; bottom: -2px; width: 1px; background: #8592a3; }
  .kv { display: flex; justify-content: space-between; font: 11.5px var(--mono); padding: 2px 0; } .kv span { color: var(--muted); }
  main { grid-row: 2; grid-column: 2; position: relative; overflow: auto; background: #10141a; }
  .progress { position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; flex-wrap: wrap; padding: 6px 12px; background: rgba(16,20,26,.92); min-height: 30px; }
  .chip { font: 11px var(--mono); padding: 2px 7px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; animation: in .2s; }
  .chip.sim { color: var(--warn); border-color: #5a4a2a; } .chip.doc { color: var(--accent); border-color: #24415f; } .chip.done { color: var(--ok); border-color: #285a3e; } .chip.err { color: var(--fail); }
  .chip.live::after { content: ""; display: inline-block; width: 6px; height: 6px; margin-left: 6px; border-radius: 50%; background: var(--warn); animation: blink .8s infinite alternate; }
  @keyframes blink { to { opacity: .2; } } @keyframes in { from { opacity: 0; transform: translateY(-3px); } }
  .stage { padding: 10px 18px 24px; }
  .sheet { position: relative; background: var(--paper); border-radius: 3px; box-shadow: 0 6px 30px rgba(0,0,0,.45); }
  .sheet svg { width: 100%; height: auto; display: block; }
  .sheet svg g[data-tag] { cursor: pointer; }
  .sheet img { width: 100%; display: block; }
  .tagbox { position: absolute; border: 1.5px solid transparent; border-radius: 4px; cursor: pointer; }
  .tagbox:hover { border-color: var(--accent); }
  .tagbox.u-ok { border-color: #2f9663; background: rgba(47,150,99,.08); }
  .tagbox.u-warn { border-color: #c5871e; background: rgba(197,135,30,.12); }
  .tagbox.u-fail { border-color: #e0392c; background: rgba(224,57,44,.15); animation: blinkbox .9s infinite alternate; }
  .tagbox.u-sel { border-color: var(--accent); }
  @keyframes blinkbox { to { background: rgba(224,57,44,.02); } }
  .sheet svg g.u-ok * { stroke: #2f9663 !important; }
  .sheet svg g.u-warn * { stroke: #c5871e !important; }
  .sheet svg g.u-fail * { stroke: #e0392c !important; }
  .sheet svg g.u-fail * { stroke-width: 1.6 !important; animation: pulse .9s infinite alternate; }
  .sheet svg g.u-sel * { stroke: var(--accent) !important; }
  @keyframes pulse { to { stroke-opacity: .35; } }
  .badge { position: absolute; transform: translate(-50%, -100%); font: 700 11px var(--mono); padding: 2px 6px; border-radius: 4px; color: white; white-space: nowrap; pointer-events: none; transition: background .25s; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  .badge.ok { background: rgba(47,150,99,.95); } .badge.warn { background: rgba(197,135,30,.96); } .badge.fail { background: rgba(214,48,38,.97); }
  .badge small { font-weight: 500; opacity: .85; }
  .note { position: absolute; transform: translate(-50%, 8px); max-width: 230px; font: 600 11px var(--sans); color: white; background: rgba(239,90,79,.95); padding: 4px 7px; border-radius: 4px; pointer-events: none; }
  .note.warn { background: rgba(197,135,30,.96); } .note.ok { background: rgba(47,150,99,.95); } .note.info { background: rgba(98,112,220,.95); }
  footer { grid-row: 3; grid-column: 2; background: var(--panel); border-top: 1px solid var(--line); display: grid; grid-template-columns: 330px 1fr; }
  .flowctl { padding: 12px 16px; border-right: 1px solid var(--line); }
  .flowv { font: 700 28px var(--mono); } .flowv small { font-size: 13px; color: var(--muted); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .verdict { padding: 14px 18px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
  .verdict .big { font: 700 20px var(--sans); }
  .verdict .sub { color: var(--muted); }
  aside.right { grid-row: 2 / 4; grid-column: 3; background: var(--panel); border-left: 1px solid var(--line); overflow: auto; }
  .rhead { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--muted); font: 600 10.5px var(--sans); letter-spacing: .8px; text-transform: uppercase; position: sticky; top: 0; background: var(--panel); z-index: 2; display: flex; justify-content: space-between; }
  .ans { border-bottom: 1px solid var(--line); padding: 12px 14px; animation: in .3s; }
  .ans .rq { color: var(--muted); font-size: 12px; } .ans .hl { font: 700 16px var(--sans); margin: 4px 0; } .ans .sm { margin: 0 0 8px; }
  .ans .meta { color: var(--muted); font: 11px var(--mono); }
  .card { background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--info); border-radius: 6px; padding: 8px 10px; margin: 8px 0; }
  .card.ok { border-left-color: var(--ok); } .card.warn { border-left-color: var(--warn); } .card.fail { border-left-color: var(--fail); }
  .card .tt { font: 600 11px var(--sans); color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .card .res { font: 600 13.5px var(--mono); margin: 3px 0 5px; color: #fff; }
  .card table { width: 100%; border-collapse: collapse; font-size: 11.5px; } .card td { padding: 2px 4px; border-top: 1px solid var(--line); vertical-align: top; }
  .card td.v { font-family: var(--mono); color: #fff; } .src { font: 10.5px var(--mono); color: var(--accent); }
  details summary { cursor: pointer; color: var(--muted); font-size: 11.5px; }
  .prop { border: 1px solid var(--line); border-radius: 7px; margin: 8px 0; overflow: hidden; }
  .prop .ph { padding: 8px 10px; display: flex; justify-content: space-between; gap: 8px; align-items: center; background: var(--panel2); }
  .prop .ph b { font-size: 13px; }
  .diff { font: 11.5px var(--mono); padding: 6px 10px; }
  .diff .m { color: #ff8b80; } .diff .p { color: #7fdca6; }
  .prop .pf { padding: 6px 10px 9px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .vb { font: 600 10.5px var(--mono); padding: 2px 7px; border-radius: 9px; }
  .vb.y { background: rgba(63,182,122,.18); color: var(--ok); } .vb.n { background: rgba(239,90,79,.18); color: var(--fail); }
  .prop.done { opacity: .6; } .prop.done .pf .btn { display: none; }
  .rev { margin: 8px 12px; padding: 7px 10px; border-left: 3px solid var(--warn); background: var(--panel2); border-radius: 4px; font-size: 12px; display: flex; justify-content: space-between; gap: 6px; }
  .empty { color: var(--muted); padding: 18px 16px; line-height: 1.6; } .empty b { color: var(--text); }
  .sugg { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .sugg .btn { text-align: left; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 50; }
  .modal.on { display: flex; }
  .modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; width: min(820px, 92vw); max-height: 84vh; overflow: auto; padding: 16px 20px; }
  .modal pre { white-space: pre-wrap; font: 12px/1.5 var(--mono); }
  .tour-on { outline: 3px solid #4da3ff !important; outline-offset: 2px; border-radius: 6px; }
  #tour { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 60; background: #0f2e45; color: #fff; border: 1px solid #4da3ff;
          border-radius: 10px; padding: 12px 16px; width: min(720px, 92vw); box-shadow: 0 10px 40px rgba(0,0,0,.5); display: none; }
  #tour .st { font: 600 11px var(--mono); color: #9fd0ff; letter-spacing: .5px; }
  #tour .tx { margin: 4px 0 10px; font-size: 14px; line-height: 1.45; }
  #tour .row { display: flex; gap: 8px; justify-content: flex-end; }
</style>
<link rel="stylesheet" href="design.css">
</head>
<body class="process">
<div class="app">
  <header>
    <a class="logo" href="home.html" style="color:var(--text);text-decoration:none" title="Back to case library">Plant<span>Agent</span></a>
    <select id="proj" title="Project"></select>
    <div class="cmd"><span class="k">›</span><input id="q" aria-label="Ask about the process unit" placeholder="Ask about this unit… e.g. What limits +20% throughput?" autocomplete="off" disabled></div>
    <button class="btn go" id="toTarget" disabled>Find a path to target</button>
    <select id="model" title="Model">
      <option value="muse-spark-1.3-contributor">Muse Spark (contributor)</option>
      <option value="muse-spark-1.3">Muse Spark</option>
      <option value="muse-wonder-1.0">Muse Wonder</option>
    </select>
  </header>

  <aside class="left">
    <div class="sec"><h4>Equipment load <span id="atScale"></span></h4><div id="eqlist" aria-live="polite"><div class="empty">Loading case data…</div></div></div>
    <div class="sec"><h4>Model <span id="builtBy"></span></h4><div id="modelBox"></div></div>
    <div class="sec"><h4>Documents</h4>
      <div class="eq" onclick="showDoc('pid')"><div class="t" id="pidName">Smart P&amp;ID <span>DEXPI XML</span></div><div class="why" id="pidStats"></div></div>
      <div class="eq" onclick="showDoc('basis')"><div class="t">Operating data sheet <span>md</span></div></div>
    </div>
    <div class="sec" id="safetySec"><h4>Safety scan <span>no AI · P&amp;ID graph</span></h4>
      <button class="btn" onclick="reliefScan()">Check every side for relief protection</button>
      <div id="relief" style="margin-top:6px"></div>
    </div>
  </aside>

  <main>
    <div class="progress" id="progress"></div>
    <div id="note" style="display:none;margin:8px 18px 0;padding:6px 10px;border:1px solid #5a4a2a;border-radius:5px;color:var(--warn);font-size:12px"></div>
    <div class="stage"><div class="sheet" id="sheet"></div></div>
  </main>

  <footer>
    <div class="flowctl">
      <div class="flowv" id="flowv">–</div>
      <input type="range" id="scale" min="80" max="250" step="1" value="100">
      <div style="display:flex;justify-content:space-between;color:var(--muted);font:11px var(--mono)"><span>80%</span><span id="tgtLbl"></span><span id="maxLbl">250%</span></div>
    </div>
    <div class="verdict"><div class="big" id="verdict">–</div><div class="sub" id="verdictSub"></div></div>
  </footer>

  <aside class="right">
    <div class="rhead"><span>Decision and evidence</span><span id="spend"></span></div>
    <div id="revs"></div>
    <div id="answers"></div>
  </aside>
</div>
<div id="tour" role="dialog" aria-live="polite"><div class="st" id="tourStep"></div><div class="tx" id="tourText"></div>
  <div class="row"><button class="btn" onclick="tourEnd()">Close</button><button class="btn go" id="tourNext" onclick="tourGo(TOUR_I + 1)">Next</button></div></div>
<div class="modal" id="modal" onclick="if(event.target===this)this.classList.remove('on')"><div class="box" id="modalBox"></div></div>

<script>
const CASE = new URLSearchParams(location.search).get('case') || 'chem_c01';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api = async (p, body) => { const r = await fetch(`/api/plant/${CASE}/${p}`, body ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)} : {});
  const data = await r.json().catch(() => null);
  if (!r.ok) throw new Error(data?.error || `Case data unavailable (${r.status})`);
  if (!data) throw new Error('Invalid response from the case server');
  return data; };
let P = null, ST = null, busy = false, base = null;
const NAMES = {pump: 'Pump', hx: 'Heat exchanger', tank: 'Tank', valve: 'Valve', heater: 'Heater / heat load', cooler: 'Cooler', compressor: 'Compressor', mixer: 'Mixer', splitter: 'Splitter', recycle: 'Loop closure'};
const sev = u => u > 1.0 ? 'fail' : u > 0.9 ? 'warn' : 'ok';

async function projects() {
  const ps = await fetch('/api/projects').then(r => r.json());
  $('proj').innerHTML = ps.filter(p => p.workspace).map(p => `<option value="${p.kind}:${p.case}" ${p.case === CASE ? 'selected' : ''}>${p.kind === 'process' ? '⚗ ' : '💧 '}${esc(p.title)}</option>`).join('');
  $('proj').onchange = e => { const [k, c] = e.target.value.split(':'); location.href = (k === 'process' ? 'plant.html' : 'workspace.html') + '?case=' + c; };
}

async function load() {
  P = await api('project');
  if (P.error) throw new Error(P.error);
  document.title = 'PlantAgent · ' + P.title;
  if (P.drawing === 'none') {  // no drawing: draw the agent's own flowsheet, one box per unit in flow order
    // no model yet: lay out the P&ID's own equipment and connections; after Build, the model's units
    const fromPid = !P.built?.spec?.units && (P.pid?.equipment || []).length;
    const us = fromPid ? P.pid.equipment.map(e => ({id: e.tag || e.id, type: e.class, in: P.pid.connections.filter(c => c.to.split('(')[0] === (e.tag || e.id)).map(c => c.from + '>' + c.to),
                                                   out: P.pid.connections.filter(c => c.from.split('(')[0] === (e.tag || e.id)).map(c => c.from + '>' + c.to)}))
                       : P.built?.spec?.units || [];
    const W = 150, H = 54, gap = 46, cols = Math.min(6, Math.max(1, us.length));
    const pos = us.map((u, i) => ({x: 30 + (i % cols) * (W + gap), y: 40 + Math.floor(i / cols) * (H + 70)}));
    const rows = Math.ceil(us.length / cols), w = 60 + cols * (W + gap), h = 80 + rows * (H + 70);
    let svgs = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs>`;
    const outOf = u => [].concat(u.out || [], u.cold ? [u.cold[1]] : [], u.hot ? [u.hot[1]] : []), inOf = u => [].concat(u.in || [], u.cold ? [u.cold[0]] : [], u.hot ? [u.hot[0]] : []);
    us.forEach((a, i) => us.forEach((b, j) => { if (i !== j && outOf(a).some(s => inOf(b).includes(s))) {
      const A = pos[i], B = pos[j]; svgs += `<line x1="${A.x + W}" y1="${A.y + H / 2}" x2="${B.x}" y2="${B.y + H / 2}" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>`; } }));
    us.forEach((u, i) => { const p = pos[i]; svgs += `<g data-tag="${esc(u.id)}"><rect x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="6" fill="#fff" stroke="#333"/>
      <text x="${p.x + W / 2}" y="${p.y + 22}" text-anchor="middle" font-size="13" font-weight="700" font-family="monospace">${esc(u.id)}</text>
      <text x="${p.x + W / 2}" y="${p.y + 40}" text-anchor="middle" font-size="11" fill="#555" font-family="sans-serif">${esc(NAMES[u.type] || u.type)}</text></g>`; });
    $('sheet').innerHTML = us.length ? svgs + '</svg>' : '<div class="empty" style="padding:30px">The flowsheet appears here once the agent has built the model from the data sheet.</div>';
  } else if (P.drawing === 'svg') {
    const r = await fetch(`/api/plant/${CASE}/svg`);
    if (!r.ok) throw new Error(`the P&ID drawing did not load (HTTP ${r.status})`);
    $('sheet').innerHTML = await r.text();
  } else {  // a PDF schematic read by Muse vision: the sheet as an image, one positioned box per tag
    $('sheet').innerHTML = `<img src="/api/plant/${CASE}/sheet.png" alt="schematic">` + Object.entries(P.pid.positions || {}).map(([t, p]) => {
      const [x0, y0, x1, y1] = p.box, pad = .012;
      return `<div class="tagbox" data-tag="${esc(t)}" title="${esc(t)} (${esc(p.source)})" style="left:${(x0 - pad) * 100}%;top:${(y0 - pad) * 100}%;width:${(x1 - x0 + 2 * pad) * 100}%;height:${(y1 - y0 + 2 * pad) * 100}%"></div>`;
    }).join('');
    await new Promise((r, x) => { const im = $('sheet').querySelector('img'); im.complete ? r() : (im.onload = r, im.onerror = () => x(new Error('the drawing image did not load'))); });
  }
  $('sheet').querySelectorAll('[data-tag]').forEach(g => { if (g.dataset.tag) g.onclick = () => select(g.dataset.tag); });
  $('safetySec').style.display = P.dexpi ? '' : 'none';  // the relief scan needs a smart (DEXPI) P&ID
  if (P.drawing === 'none' && !P.dexpi) $('pidStats').textContent = 'equipment and connections from the data sheet';
  if (P.drawing === 'none') $('pidName').innerHTML = P.dexpi ? 'Smart P&amp;ID <span>DEXPI XML · flowsheet drawn from the model</span>' : 'No drawing <span>flowsheet drawn from the model</span>';
  if (P.drawing === 'pdf') $('pidName').innerHTML = `Schematic (PDF) <span>read by ${esc((P.pid.model || 'Muse').replace('muse-', ''))}</span>`;
  if (P.data_note) { $('note').textContent = '⚠ ' + P.data_note; $('note').style.display = 'block'; }
  const hi = Math.max(150, Math.ceil(P.target_scale * 100 / 10) * 10 + 30);
  $('scale').max = hi; $('maxLbl').textContent = hi + '%';
  if (P.drawing !== 'none' || P.dexpi) $('pidStats').textContent = `${P.pid.equipment.length} equipment · ${P.pid.connections.length} connections · ${P.pid.valves.length} valves · ${P.pid.control.length} signals`;
  const feed = Object.entries(P.built?.spec?.feeds || {}).find(([k, f]) => !f.utility);
  base = P.throughput ? {name: P.throughput.name, m3_h: P.throughput.base, unit: P.throughput.unit} :
    feed ? {name: feed[0], m3_h: feed[1].m3_h ?? feed[1].kg_h, unit: feed[1].m3_h != null ? 'm³/h' : 'kg/h'} : null;
  $('tgtLbl').textContent = `target ${Math.round(P.target_scale * 100)}%`;
  $('scale').value = Math.round(P.target_scale * 100);
  model(); answers(); revs();
  if (P.built) render(P.at_target); else noModel();
  $('q').disabled = false;
  $('toTarget').disabled = false;
}

function noModel() {
  $('eqlist').innerHTML = `<div class="empty">No simulation model yet.<br>The agent reads the <b>P&amp;ID</b> and the <b>operating data sheet</b> and builds a calibrated DWSIM model itself.</div>`;
  $('answers').innerHTML = `<div class="empty"><button class="btn go" onclick="build()">Build the model from the P&amp;ID</button></div>`;
  $('verdict').textContent = 'No model yet';
}

function model() {
  const b = P.built;
  if (!b) { $('modelBox').innerHTML = ''; return; }
  $('builtBy').textContent = `${b.model.replace('muse-', '').replace('-contributor', '')} · ${b.seconds}s`;
  $('modelBox').innerHTML = `<div class="why" style="color:var(--muted);font-size:11.5px;margin-bottom:6px">DWSIM flowsheet built by the agent from the P&amp;ID, ${b.spec.units.length} units. Calibration:</div>` +
    `<details><summary>${(b.calibration || []).length} measured values reproduced</summary>` +
    (b.calibration || []).map(c => `<div class="kv"><span>${esc(c.item)}</span>${esc(String(c.simulated).split(' (')[0])} <span>vs ${esc(String(c.measured).split(' (')[0])}</span></div>`).join('') + `</details>` +
    (b.coverage ? `<div class="kv" style="margin-top:6px"><span>P&amp;ID coverage</span>${b.coverage.connections.filter(c => c.modelled).length} of ${b.coverage.connections.filter(c => !c.relief_path).length} flow connections ${b.coverage.missing_connections.length || b.coverage.missing_equipment.length ? '<b style="color:var(--fail)">✗</b>' : '<b style="color:var(--ok)">✓</b>'}</div>
      <div style="color:var(--muted);font-size:11px">${b.coverage.connections.filter(c => c.relief_path).length} relief path(s) excluded: no normal flow</div>` : '') +
    ((P.pid.data_quality || []).length ? `<details style="margin-top:6px"><summary style="color:var(--warn)">⚠ ${P.pid.data_quality.length} P&amp;ID data problems</summary>${P.pid.data_quality.map(a => `<div style="font-size:11.5px;color:var(--muted);padding:2px 0">• ${esc(a)}</div>`).join('')}</details>` : '') +
    `<details style="margin-top:6px"><summary>${(b.assumptions || []).length} assumptions</summary>${(b.assumptions || []).map(a => `<div style="font-size:11.5px;color:var(--muted);padding:2px 0">• ${esc(a)}</div>`).join('')}</details>` +
    `<div style="margin-top:8px"><button class="btn" onclick="build()">Rebuild model</button></div>`;
}

function worstBy(checks) {
  const m = {};
  for (const c of checks || []) if (c.utilisation != null && (!m[c.id] || c.utilisation > m[c.id].utilisation)) m[c.id] = c;
  return m;
}

function render(st) {
  ST = st;
  const w = worstBy(st.checks), units = Object.fromEntries((P.built.spec.units || []).map(u => [u.id, u]));
  const s = st.scale;
  $('atScale').textContent = Math.round(s * 100) + '%';
  $('flowv').innerHTML = base ? `${(base.m3_h * s).toFixed(1)} <small>${base.unit} · ${s >= 1 ? '+' : ''}${Math.round((s - 1) * 100)}%</small>` : `${Math.round(s * 100)}%`;
  const rows = Object.values(w).sort((a, b) => b.utilisation - a.utilisation);
  $('eqlist').innerHTML = rows.map(c => {
    const feeds = P.built.spec.feeds || {};
    const u = units[c.id], name = u ? NAMES[u.type] || u.type : feeds[c.id]?.utility ? 'Utility supply' : 'Process stream';
    return `<div class="eq" data-id="${esc(c.id)}" onclick="select('${esc(c.id)}')"><div class="t">${esc(c.id)} <span>${Math.round(c.utilisation * 100)}%</span></div>
      <div class="bar"><i style="width:${Math.min(100, c.utilisation / 1.3 * 100)}%;background:var(--${sev(c.utilisation)})"></i></div>
      <div class="why">${esc(name)} · ${esc(c.check)}: ${fmt(c.value)} of ${fmt(c.limit)} ${esc(c.unit)}</div></div>`;
  }).join('') || '<div class="empty">No limits in the model.</div>';
  // colour the P&ID and badge each tagged equipment item
  const sheet = $('sheet');
  sheet.querySelectorAll('.badge').forEach(b => b.remove());
  sheet.querySelectorAll('[data-tag]').forEach(g => g.classList.remove('u-ok', 'u-warn', 'u-fail'));
  const box = sheet.getBoundingClientRect();
  for (const c of rows) {
    const g = sheet.querySelector(`[data-tag="${CSS.escape(c.id)}"]`);
    if (!g) continue;
    g.classList.add('u-' + sev(c.utilisation));
    const r = g.getBoundingClientRect();
    const b = document.createElement('div');
    b.className = 'badge ' + sev(c.utilisation);
    b.style.left = (r.left + r.width / 2 - box.left) + 'px';
    b.style.top = (r.top - box.top - 4) + 'px';
    b.innerHTML = `${esc(c.id)} ${Math.round(c.utilisation * 100)}%`;
    sheet.appendChild(b);
  }
  const top = rows[0], cap = P.capacity;
  const over = rows.filter(c => c.utilisation > 1);
  $('verdict').innerHTML = over.length ? `<span style="color:var(--fail)">✗ Not at ${Math.round(s * 100)}%</span> — ${esc(over[0].id)} is over its limit`
    : `<span style="color:var(--ok)">✓ Runs at ${Math.round(s * 100)}%</span> — tightest: ${esc(top?.id || '')} ${top ? Math.round(top.utilisation * 100) + '%' : ''}`;
  $('verdictSub').innerHTML = cap?.capacity_multiple ? `Simulated maximum: <b>${Math.round(cap.capacity_multiple * 100)}%</b> of today's throughput, first limit <b>${esc(cap.limited_by?.id)}</b> (${esc(cap.limited_by?.check)}). ${st.replayed ? 'Recorded DWSIM solution of this model (re-solved live when the model changes).' : 'Solved live in DWSIM.'}` : '';
}
const fmt = v => typeof v === 'number' ? (Math.abs(v) >= 100 ? v.toFixed(0) : v.toFixed(1)) : v;

function select(tag) {
  document.querySelectorAll('.eq.sel').forEach(e => e.classList.remove('sel'));
  document.querySelectorAll('.eq[data-id]').forEach(e => { if (e.dataset.id === tag) e.classList.add('sel'); });
  $('sheet').querySelectorAll('.u-sel').forEach(g => g.classList.remove('u-sel'));
  $('sheet').querySelector(`[data-tag="${CSS.escape(tag)}"]`)?.classList.add('u-sel');
  const e = P.pid.equipment.find(x => x.tag === tag);
  $('q').value = e ? `Why is ${tag} (${e.class}) limiting, and what is the cheapest fix?` : `What limits ${tag}?`;
  $('q').focus();
}

let tmr = null;
$('scale').oninput = () => {
  if (!P?.built) return;
  const s = $('scale').value / 100;
  $('flowv').innerHTML = base ? `${(base.m3_h * s).toFixed(1)} <small>${base.unit} · solving…</small>` : '…';
  clearTimeout(tmr);
  tmr = setTimeout(async () => render(await api('state?scale=' + s)), 120);
};

function chip(e) {
  const kind = e.kind === 'tool' ? (/run_process|process_capacity/.test(e.name) ? 'sim' : 'doc') : e.kind === 'say' ? '' : 'done';
  const label = { read_pid: 'Reading the P&ID', read_data_sheet: 'Reading the operating data sheet', run_process: 'DWSIM solve', process_capacity: 'DWSIM capacity search', get_spec: 'Loading the model' }[e.name] || e.name || (e.text || '').slice(0, 80);
  const arg = e.args ? (e.args.match(/"label": ?"([^"]+)"/) || [])[1] : '';
  return `<span class="chip ${kind}">${esc(label)}${arg ? ' · ' + esc(arg) : ''}</span>`;
}

async function follow(job, title) {
  busy = true; document.querySelectorAll('header .btn').forEach(b => b.disabled = true);
  $('progress').innerHTML = `<span class="chip live">${esc(title)}</span>`;
  let off = 0, t0 = Date.now();
  while (true) {
    const j = await fetch(`/api/job/${job}?offset=${off}`).then(r => r.json());
    off = j.offset;
    for (const e of j.events) if (e.kind === 'tool') $('progress').insertAdjacentHTML('beforeend', chip(e));
    if (j.done) {
      busy = false; document.querySelectorAll('header .btn').forEach(b => b.disabled = false);
      $('progress').insertAdjacentHTML('beforeend', j.error ? `<span class="chip err">${esc(j.error)}</span>` : `<span class="chip done">done in ${Math.round((Date.now() - t0) / 1000)}s</span>`);
      return j;
    }
    await new Promise(r => setTimeout(r, 700));
  }
}

async function build() {
  if (busy) return;
  const {job} = await api('build', {});
  const j = await follow(job, 'Building the simulation model from the P&ID');
  if (!j.error) await load();
}

async function ask(text, context) {
  if (busy || !text.trim()) return;
  $('answers').insertAdjacentHTML('afterbegin', `<div class="ans" id="pending"><div class="rq">› <b>${esc(text)}</b></div><div class="meta">working…</div></div>`);
  const {job} = await api('ask', {text, context});
  const j = await follow(job, text);
  $('pending')?.remove();
  if (j.answer) { P.answers.push(j.answer); answers(); notes(j.answer); }
}

function notes(a) {
  const sheet = $('sheet'), box = sheet.getBoundingClientRect();
  sheet.querySelectorAll('.note').forEach(n => n.remove());
  for (const h of a.highlights || []) {
    const g = sheet.querySelector(`[data-tag="${CSS.escape(h.tag)}"]`);
    if (!g) continue;
    const r = g.getBoundingClientRect(), n = document.createElement('div');
    n.className = 'note ' + (h.severity || 'info');
    n.style.left = (r.left + r.width / 2 - box.left) + 'px';
    n.style.top = (r.top - box.top + 22) + 'px';  // the tag's group also holds its datasheet table: anchor at the symbol's top
    n.textContent = h.text;
    sheet.appendChild(n);
  }
}

function answers() {
  if (!P.built) return;
  const list = [...(P.answers || [])].reverse();
  $('answers').innerHTML = list.length ? list.map((a, i) => ans(a, P.answers.length - 1 - i)).join('') :
    `<div class="empty"><b>What would you like to test?</b><br>Ask about an equipment limit, or find a path to the target throughput.
     <div class="sugg">${['What limits +20% throughput?', 'Which exchanger is closest to its limit, and why?', 'How much headroom does the cooling water have?'].map(s => `<button class="btn" onclick="ask('${s}')">${s}</button>`).join('')}</div></div>`;
  $('spend').textContent = list.length ? '$' + list.reduce((t, a) => t + (a.cost_usd || 0), 0).toFixed(3) : '';
}

const BASIS = {documented: ['in document', '#4da3ff'], measured: ['measured', '#3fb67a'], computed: ['computed', '#e3a33a'], assumed: ['assumed', '#ef5a4f']};
const basisOf = x => x.basis || (/run|dwsim|simulat|solve/i.test(x.source || '') ? 'computed' : /assum|judg|estimat/i.test(x.source || '') ? 'assumed'
  : /measur|dcs|scada|historian|test|current operation/i.test(x.source || '') ? 'measured' : 'documented');
const basisChip = b => `<span class="vb" style="border:1px solid ${BASIS[b][1]};color:${BASIS[b][1]}">${BASIS[b][0]}</span>`;
function compare(a) {  // the alternatives side by side, from what the server re-solved
  const ps = a.proposals || [];
  if (ps.length < 2) return '';
  return `<div class="card"><div class="tt">Alternatives compared · each re-solved in DWSIM</div><table>
    <tr><td><b>Change</b></td><td><b>Fixes</b></td><td><b>Max throughput after</b></td><td><b>Cost</b></td><td><b>Status</b></td></tr>
    ${ps.map(p => `<tr><td>${esc(p.title)}</td><td class="v">${esc(p.fixes || p.tag || '')}</td><td class="v">${p.capacity_multiple ? Math.round(p.capacity_multiple * 100) + '%' : '—'}</td>
      <td>${esc(p.cost_class || '')}</td><td>${p.verified ? '<span style="color:var(--ok)">simulated ✓</span>' : `<span style="color:var(--fail)">${p.unverified_reason ? 'not verifiable' : 'fails'}</span>`}</td></tr>`).join('')}</table></div>`;
}
function ans(a, idx) {
  const cards = (a.cards || []).map(c => `<div class="card ${c.status || ''}"><div class="tt">${esc(c.title)}</div><div class="res">${esc(c.result)}</div>
    ${(c.inputs || []).length ? `<details><summary>${c.inputs.length} inputs (${[...new Set(c.inputs.map(basisOf))].join(', ')}) · runs: ${esc((c.runs || []).join(', ') || 'none')}</summary><table>${c.inputs.map(x => `<tr><td>${esc(x.name)}</td><td class="v">${esc(x.value)}</td><td>${basisChip(basisOf(x))}</td><td class="src">${esc(x.source)}</td></tr>`).join('')}</table></details>` : ''}</div>`).join('');
  const fc = (a.field_checks || []).length ? `<div class="card warn"><div class="tt">Before deciding: field checks</div><table>${a.field_checks.map(f => `<tr><td>${esc(f.item)}</td><td>${esc(f.where)}</td><td class="src">${esc(f.changes)}</td></tr>`).join('')}</table></div>` : '';
  const props = (a.proposals || []).map((p, j) => prop(p, idx, j)).join('');
  const cb = a.combined, comb = cb && !cb.error ? `<div class="card ${cb.reaches_target ? 'ok' : 'fail'}"><div class="tt">All ${a.proposals.length} changes together · re-solved in DWSIM</div>
    <div class="res">${cb.reaches_target ? '✓ Reaches ' + Math.round(P.target_scale * 100) + '%' : '✗ Short of target'} · new maximum ${Math.round((cb.capacity_multiple || 0) * 100)}% (${esc(cb.limited_by?.id || '')})</div></div>` : '';
  return `<div class="ans"><div class="rq">› ${esc(a.request)}</div><div class="hl">${esc(a.headline)}</div><div class="sm">${esc(a.summary)}</div>${fc}${props}${compare(a)}${comb}${cards}
    <div class="meta">${a.seconds}s · $${(a.cost_usd || 0).toFixed(4)} · ${(a.checks || []).filter(c => c.ok).length}/${(a.checks || []).length} cited runs re-solved to the same result${(a.checks || []).filter(c => !c.ok).map(c => ` · <span style="color:var(--fail)">✗ ${esc(c.item)}: ${esc(c.why || 'not reproduced')}</span>`).join('')}</div></div>`;
}

function prop(p, i, j) {
  const spec = P.built.spec, units = Object.fromEntries(spec.units.map(u => [u.id, u]));
  const cur = path => { const [k, id, f] = path.split('.'); const o = k === 'units' ? units[id] : (spec[k] || {})[id]; return o ? o[f] : undefined; };
  const diff = (p.changes || []).map(c => `<div><span class="m">- ${esc(c.path)} = ${esc(('from' in c ? c.from : cur(c.path)) ?? '—')}</span><br><span class="p">+ ${esc(c.path)} = ${esc(c.value)}</span></div>`).join('');
  const v = p.verified ? `<span class="vb y" title="Re-solved in DWSIM with this change at ${Math.round(P.target_scale * 100)}% throughput; every limit of ${esc(p.fixes || '')} within 100 %, nothing else pushed over.">✓ Simulated: ${esc(p.fixes || '')} within limits at ${Math.round(P.target_scale * 100)}%</span>`
    : `<span class="vb n">✗ ${p.unverified_reason ? 'Not verifiable: ' + esc(p.unverified_reason) : p.error ? 'did not solve' : esc((p.still_over?.[0] || p.breaks?.[0] || {}).id || '') + ' still over its limit'}</span>`;
  return `<div class="prop ${p.accepted ? 'done' : ''}"><div class="ph"><b>${esc(p.title)}</b><span class="vb" style="color:var(--muted)">${esc(p.cost_class || '')}</span></div>
    <div class="diff">${diff}</div>${p.why ? `<div class="diff" style="color:var(--muted);font-family:var(--sans)">${esc(p.why)}</div>` : ''}
    <div class="pf">${v}${p.verified ? `<button class="btn go" onclick="accept(${i},${j})" title="Applies the change to the working model as a draft revision. It is not an engineering approval or signature.">Apply as draft model revision</button><button class="btn" onclick="this.closest('.prop').remove()">Dismiss</button>` : ''}${p.accepted ? '<span class="vb y">applied as draft revision</span>' : ''}</div></div>`;
}

async function accept(i, j) {
  const p = P.answers[i].proposals[j];
  const reason = prompt('Applying this as a DRAFT model revision (not an engineering approval). Reason, kept in the audit trail:', p.title || '');
  if (!reason) return;
  const r = await api('accept', {proposal: p, reason});
  if (r.error) { alert(r.error); return; }
  p.accepted = true;
  await reload();
}

async function reload() {
  const keep = P.answers;
  P = await api('project'); P.answers = keep;
  model(); answers(); revs(); render(await api('state?scale=' + $('scale').value / 100));
}

function revs() {
  const a = P.audit;
  $('revs').innerHTML = (P.revisions || []).map(r => `<div class="rev"><div><b>Rev ${r.rev}</b> ${esc(r.title)}<div style="color:var(--muted);font:11px var(--mono)">${r.changes.map(c => esc(c.path) + '=' + esc(c.value)).join(', ')}${r.capacity_multiple ? ' · max ' + Math.round(r.capacity_multiple * 100) + '%' : ''}</div>
      <div style="color:var(--muted);font-size:11px">${esc(r.at || '')} · ${esc(r.user || 'engineer')} · “${esc(r.reason || '')}”</div></div>${r.kind === 'change' ? `<button class="btn" onclick="undo(${r.rev})">Undo</button>` : ''}</div>`).join('') +
    (a ? `<div class="rev" style="border-left-color:${a.verify.ok ? 'var(--ok)' : 'var(--fail)'}"><div>Audit trail: ${a.verify.entries} entries · hash chain ${a.verify.ok ? 'intact ✓' : 'BROKEN at ' + a.verify.broken_at}</div><button class="btn" onclick="showAudit()">View</button></div>` : '');
}
async function undo(rev) {
  const reason = prompt(`Reason for undoing Rev ${rev} (kept in the audit trail):`);
  if (!reason) return;
  const r = await api('restore', {rev, reason});
  if (r.error) { alert(r.error); return; }
  await reload();
}
function showAudit() {
  $('modalBox').innerHTML = `<h3>Audit trail (append-only, hash-chained)</h3><pre>${esc(P.audit.entries.map(e => `#${e.seq} ${e.at} ${e.user} ${e.action}${e.reason ? ' — ' + e.reason : ''}\n   ${JSON.stringify(e.details).slice(0, 220)}\n   hash ${e.hash.slice(0, 16)}… prev ${e.prev.slice(0, 16)}…`).join('\n'))}</pre>`;
  $('modal').classList.add('on');
}

function showDoc(which) {
  $('modalBox').innerHTML = which === 'basis' ? `<pre>${esc(P.basis)}</pre>` :
    `<h3>Smart P&amp;ID (read directly from the DEXPI XML)</h3><pre>${esc(P.pid.equipment.map(e => `${e.tag}  ${e.class}  ${JSON.stringify(e.design)}`).join('\n'))}\n\n${esc(P.pid.connections.map(c => `${c.from} → ${c.inline.join(' → ')}${c.inline.length ? ' → ' : ''}${c.to}`).join('\n'))}\n\n${esc(P.pid.control.join('\n'))}</pre>`;
  $('modal').classList.add('on');
}

async function reliefScan() {
  const rs = await api('relief');
  const col = r => r.status === 'protected' ? 'ok' : r.thermal_expansion_risk ? 'fail' : 'warn';
  if (!rs.length) { $('relief').innerHTML = '<div class="why">No equipment with nozzles found on this P&ID: nothing to check.</div>'; return; }
  $('relief').innerHTML = rs.map(r => `<div class="eq" onclick="select('${esc(r.tag)}')"><div class="t">${esc(r.tag)} <span>${esc(r.side_fluids.join(','))} side</span></div>
    <div class="why" style="color:var(--${col(r)})">${r.status === 'protected' ? '✓' : '⚠'} ${esc(r.status)}${r.thermal_expansion_risk ? ' · can be blocked in while heated' : ''}</div>
    <div class="why">${esc(r.detail)}</div></div>`).join('');
  const sheet = $('sheet'), box = sheet.getBoundingClientRect();
  sheet.querySelectorAll('.note').forEach(n => n.remove());
  const byTag = {};
  for (const r of rs) if (r.status !== 'protected') (byTag[r.tag] = byTag[r.tag] || []).push(r);
  for (const [tag, list] of Object.entries(byTag)) {
    const g = sheet.querySelector(`[data-tag="${CSS.escape(tag)}"]`); if (!g) continue;
    const b = g.getBoundingClientRect(), n = document.createElement('div');
    const hot = list.filter(r => r.thermal_expansion_risk);
    n.className = 'note ' + (hot.length ? 'fail' : 'warn');
    n.style.left = (b.left + b.width / 2 - box.left) + 'px'; n.style.top = (b.top - box.top + 22) + 'px';
    n.textContent = hot.length ? `${tag}: ${hot.map(r => r.side_fluids.join(',')).join(' and ')} side can be blocked in while heated, no relief`
      : `${tag}: ${list.map(r => r.status).join(', ')}`;
    sheet.appendChild(n);
  }
}

$('q').onkeydown = e => { if (e.key === 'Enter') { ask($('q').value); $('q').value = ''; } };
$('toTarget').onclick = () => ask(`Get the unit to ${Math.round(P.target_scale * 100)}% of today's throughput. Find every equipment item that limits it and propose the cheapest change for each, verified in DWSIM, within every utility and frame limit on the data sheet.`);
// ---- guided demo: question -> source drawing -> limit -> proposal -> before/after -> evidence ----
let TOUR_I = 0;
const TOUR = [
  ['The source', 'A real P&ID in the DEXPI exchange standard (the DEXPI reference unit; the operating data sheet is illustrative). The agent read it and built this DWSIM simulation itself, reproducing the 14 measured values on the data sheet.', () => ['sheet', 'modelBox'], () => setScale(100)],
  ['The question', 'Sales wants +20 % throughput. Move to 120 %: every equipment item on the P&ID is re-solved in DWSIM and coloured by how close it runs to its limit.', () => ['scale', 'verdict'], () => setScale(Math.round(P.target_scale * 100))],
  ['What limits it', 'Three limits bind: the H1007 cooler outlet, the tank temperature held by the H1008 loop, and the quality-control hold time in T4750. Each bar shows the value against the documented limit.', () => ['eqlist'], null],
  ['The fixes', 'The agent proposes the cheapest change for each limit, within the utility supply limits on the data sheet. The server re-solves each one in DWSIM before it can be applied; a change that only edits a limit is refused.', () => ['answers'], () => document.querySelector('.prop')?.scrollIntoView({block: 'center'})],
  ['Before and after', 'All changes together, re-solved: the unit reaches 120 % and the new maximum is about 124 %. No capital spend: operating changes inside documented limits.', () => ['answers'], () => [...document.querySelectorAll('.card')].find(c => /All \d+ changes together|Alternatives compared/.test(c.textContent))?.scrollIntoView({block: 'center'})],
  ['The evidence', 'Every input is labelled as in a document, measured, computed or assumed, and every cited run is re-solved to the same result. Changes are draft model revisions with a reason, kept in a hash-chained audit trail. The P&ID coverage check confirms the model has every flow connection on the drawing.', () => ['revs', 'modelBox'], null],
];
function setScale(v) { $('scale').value = v; $('scale').oninput(); }
function tourGo(i) {
  document.querySelectorAll('.tour-on').forEach(e => e.classList.remove('tour-on'));
  if (i >= TOUR.length) return tourEnd();
  TOUR_I = i;
  const [t, x, on, act] = TOUR[i];
  $('tour').style.display = 'block';
  $('tourStep').textContent = `Step ${i + 1} of ${TOUR.length} · ${t}`;
  $('tourText').textContent = x;
  $('tourNext').textContent = i === TOUR.length - 1 ? 'Finish' : 'Next';
  on().forEach(id => $(id)?.classList.add('tour-on'));
  if (act) act();
}
function tourEnd() { $('tour').style.display = 'none'; document.querySelectorAll('.tour-on').forEach(e => e.classList.remove('tour-on')); }

$('model').onchange = e => api('model', {model: e.target.value});
window.onresize = () => ST && render(ST);
projects().catch(() => { $('proj').innerHTML = '<option>Project list unavailable</option>'; });
load().then(() => { if (new URLSearchParams(location.search).get('tour') && P?.built) tourGo(0); }).catch(e => {
  $('eqlist').innerHTML = `<div class="empty" role="alert"><b>Could not load this case.</b><br>${esc(e.message)}<br><button class="btn" onclick="location.reload()">Reload the page</button></div>`;
  $('sheet').innerHTML = '<div class="sheet-error">The source drawing could not be displayed. Check the case server and reload.</div>';
  $('answers').innerHTML = '<div class="empty">Check that the project data and simulation server are available, then reload.</div>';
  $('verdict').textContent = 'Case unavailable';
});
</script>
</body>
</html>
